<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bryte Church - Room Schedule</title>
	<script src="https://code.jquery.com/jquery-3.6.3.min.js" integrity3="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js" integrity="sha256-lSjKY0/srUM9BE3dPm+c4fBo1dky2v27Gdjm2uoZaL0=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/gasparesganga-jquery-loading-overlay@2.1.7/dist/loadingoverlay.min.js"></script>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
	<link href='https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/ui-lightness/jquery-ui.css' rel='stylesheet'>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
	<link rel="stylesheet" href="calendar.css">


	<script>
	var rooms;
	var t_n;
	var return_code;
	var eventIds = [];
	var eventInfo = {};
	var busyColor = 'rgba(252, 225, 220, 0.9)';
	var eventRequestFormUrl = 'https://bryte.churchcenter.com/calendar/forms/23823';
	var eventRequestSlot = null;

	$(function(){
		//if page is accessed by reload (f5) redirect to new page. this is needed becuase old parameter 'code' cannot be reused
		if (performance.navigation.type == performance.navigation.TYPE_RELOAD)
			window.location = location.hostname;

		const queryString = window.location.search;
		const urlParams = new URLSearchParams(queryString);
		return_code = urlParams.get('code');

		if (!t_n && !return_code){
			window.location="https://api.planningcenteronline.com/oauth/authorize?client_id=4d16b452f211191a3a92d5f8579caef561dfd759148f1f096921c845ec97337d&redirect_uri=https://rusyus2000.github.io&response_type=code&scope=calendar";
			return;
		}
		if(!t_n)
			app_authenticate();


		//var date = new Date().toLocaleDateString('en-CA');

		$( "#datepicker" ).datepicker({
			dateFormat: 'yy-mm-dd, DD',
		})
		.on("change",function(){
			RefreshCalendar();
		})
		$("#datepicker").datepicker( "setDate" , new Date());

		initializeEventRequest();
		RefreshCalendar();

	});

	function LoadDetails()
	{
		//this loop gets details for each event after page is loaded
		$.each(eventIds,function(i,eId){
			var event = ajax('https://api.planningcenteronline.com/calendar/v2/events/'+eId+'?include=owner',true,AddEvent);
		});
	}
	function AddEvent(event)
	{
		var owner = event.included && event.included[0] ? event.included[0].attributes : {};
		var phones = owner.contact_data && owner.contact_data.phone_numbers || [];
		eventInfo[event.data.id]={eventName:event.data.attributes.name,
					  ownerName:[owner.first_name, owner.last_name].filter(Boolean).join(' '),
					  phone:phones.length ? phones[0].number : ''};
	}
	function RefreshCalendar()
	{
		closeEventRequest();
		$("#divMain").LoadingOverlay("show", true);

		eventIds = [];
		var dateStr = $("#datepicker").val()
		var dateOnly = dateStr.substring(0, dateStr.indexOf(","));
		$("#selectedDay").text(parseDateString(dateOnly).toLocaleDateString("en-US", {weekday:"long", month:"long", day:"numeric", year:"numeric"}));
		var nextDateOnly = addDaysToDateString(dateOnly, 1);
		var daySchedule = ajax("https://api.planningcenteronline.com/calendar/v2/resource_bookings?order=starts_at&where[starts_at][lt]="+nextDateOnly+"&where[ends_at][gte]="+dateOnly,false,null)
		var dayEvents = ajax("https://api.planningcenteronline.com/calendar/v2/event_instances?include=resource_bookings&order=starts_at&where[starts_at][lt]="+nextDateOnly+"&where[ends_at][gte]="+dateOnly,false,null)
		generateCalendar(rooms, daySchedule, dateOnly);
		generateUnassignedEvents(dayEvents, daySchedule, dateOnly);
		LoadDetails();

		$("#divMain").LoadingOverlay("hide", true);
	}

	function ajax(url,isAsync,callbackFunction){
		console.log("ajax call: " + url);
		var returnVal;
		$.ajax
			({
			  type: "GET",
			  url: url,
			  dataType: 'json',
			  async: isAsync,
			  beforeSend: function(xhr) {
				xhr.setRequestHeader("Authorization", "Bearer " + t_n);
				},
			  success: function (data){
				returnVal = data;
				if(callbackFunction)
					callbackFunction(data);
			  },
			  error: function(response){
				console.log("ajax error: " + response.statusText);
			  }
			});
			return returnVal;
	}

	function app_authenticate(){
		var _url = "https://api.planningcenteronline.com/oauth/token?grant_type=authorization_code&code="+return_code+"&client_id=4d16b452f211191a3a92d5f8579caef561dfd759148f1f096921c845ec97337d&client_secret=ea32b02c65e4fb51415063b77168f1c611137b77b5f445f6d85ac2a00834e893&redirect_uri=https://rusyus2000.github.io";
		$.ajax
			({
			  type: "POST",
			  url: _url,
			  async: false,
			  success: function (data){
				t_n=data.access_token;
			  },
			  error: function(response){
				console.log("app_authenticate error: " + response.statusText);
			  }
			});
	}


	function generateCalendar(roomsObj, scheduleObj, selectedDate)
	{

		if (!roomsObj){
			rooms = ajax("https://api.planningcenteronline.com/calendar/v2/resources?filter=rooms&order=name",false,null);
			roomsObj = rooms;
		}


		$("#divMain").empty();

		jQuery('<div>', {class:"schedule-scroll", tabindex:0, role:"region", "aria-label":"Room availability by hour"}).appendTo("#divMain");
		jQuery('<table >',{
			id: "tblCalendar",
			"aria-label": "Room availability"
		}).appendTo(".schedule-scroll");

		//first row
		var th = jQuery('<tr>');
		th.appendTo("#tblCalendar");
		for (let i=6; i<=22; i++)
		{
			if (i==6){
					var blanktd = jQuery('<th scope="col">').text("Room");
					blanktd.appendTo(th);
			}
			else
			{
				var timetd = jQuery('<th scope="col">');
				timetd.append('&nbsp;'+(i<=12?i:i-12)+(i<12?"am":"pm")+'&nbsp;');
				timetd.appendTo(th);
			}

		}

		//this loop creates layout
		$.each(roomsObj.data, function(j){

			//add separators
			if (roomsObj.data[j].id == 464259
				|| roomsObj.data[j].id == 464821
				|| roomsObj.data[j].id == 464240)
			{
				var tr = jQuery('<tr id="trSeparator'+roomsObj.data[j].id+'" class="room-separator">');
				tr.appendTo("#tblCalendar");
				var td=jQuery('<td>',{colspan:'17'});
				td.appendTo(tr);
			}

			var tr = jQuery('<tr id="tr'+roomsObj.data[j].id+'">');
			tr.appendTo("#tblCalendar");



			for (let i=6; i<=22; i++)
			{
				if (i==6){
					var td = jQuery('<th scope="row">');
					td.text(roomsObj.data[j].attributes.name);
					td.appendTo(tr);
				}
				else{
					var td = jQuery('<td>',{
						class:'time-slot',
						id:i+'-'+roomsObj.data[j].id
						});
					td.appendTo(tr);
				}
			}
		})


		var dayBounds = getLocalDayBounds(selectedDate);

		//this loop goes through all scheduled resources that overlap the selected date and highlights them on calendar
		$.each(scheduleObj.data,function(i){
			var currEventId;
			var currentColor;
			var bookingStart = new Date(scheduleObj.data[i].attributes.starts_at);
			var bookingEnd = new Date(scheduleObj.data[i].attributes.ends_at);

			if (!timeRangesOverlap(bookingStart, bookingEnd, dayBounds.start, dayBounds.end))
				return;

			//this loop marks each visible hour that overlaps the booking, including multiday bookings
			for (let t=7;t<=22;t++)
			{
				var slotStart = new Date(dayBounds.start);
				slotStart.setHours(t, 0, 0, 0);
				var slotEnd = new Date(dayBounds.start);
				slotEnd.setHours(t + 1, 0, 0, 0);

				if (timeRangesOverlap(bookingStart, bookingEnd, slotStart, slotEnd)){
					MarkTimeSlot(t,scheduleObj.data[i].relationships.resource.data.id,scheduleObj.data[i].relationships.event.data.id,scheduleObj.data[i].relationships.event_instance.data.id);
				}
			}

		});

	}

	function timeRangesOverlap(startA, endA, startB, endB)
	{
		return startA < endB && endA > startB;
	}

	function initializeEventRequest() {
		$("#divMain").off("contextmenu.eventRequest").on("contextmenu.eventRequest", "#tblCalendar td.time-slot", function(e) {
			if (this.hasAttribute("event-id")) return;
			e.preventDefault();
			closeEventRequest();
			var date = $("#datepicker").val().split(",")[0];
			var hour = Number(this.id.split("-")[0]);
			var roomName = $(this).closest("tr").find("th[scope='row']").text();
			eventRequestSlot = {date:date, hour:hour, cell:this};
			$(this).addClass("request-selected");
			$("#divInfo").hide();
			$("#requestRoom").text(roomName);
			$("#requestTime").text(parseDateString(date).toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"}) + " / " + formatSlotHour(hour) + " - " + formatSlotHour(hour + 1) + " PT");
			var input = document.getElementById("requestEventName");
			input.value = "";
			input.setCustomValidity("");
			var popup = document.getElementById("eventRequestPopup");
			popup.hidden = false;
			var bounds = popup.getBoundingClientRect();
			popup.style.left = Math.max(8, Math.min(e.clientX, window.innerWidth - bounds.width - 8)) + "px";
			popup.style.top = Math.max(8, Math.min(e.clientY + 8, window.innerHeight - bounds.height - 8)) + "px";
			input.focus({preventScroll:true});
		});
		$("#eventRequestForm").off("submit.eventRequest").on("submit.eventRequest", function(e) {
			e.preventDefault();
			if (!eventRequestSlot) return;
			var input = document.getElementById("requestEventName");
			var name = input.value.trim();
			input.setCustomValidity(name ? "" : "Enter an event name.");
			if (!input.reportValidity()) return;
			var url = new URL(eventRequestFormUrl);
			url.searchParams.set("prefill", JSON.stringify({
				event_name:name,
				notes:name,
				starts_at:churchSlotDateTime(eventRequestSlot.date, eventRequestSlot.hour),
				ends_at:churchSlotDateTime(eventRequestSlot.date, eventRequestSlot.hour + 1)
			}));
			window.open(url.href, "_blank", "noopener,noreferrer");
			closeEventRequest();
		});
		$("#requestEventName").off("input.eventRequest").on("input.eventRequest", function(){this.setCustomValidity("");});
		$(document).off("pointerdown.eventRequest keydown.eventRequest")
			.on("pointerdown.eventRequest", function(e){if (!$(e.target).closest("#eventRequestPopup").length) closeEventRequest();})
			.on("keydown.eventRequest", function(e){
				if (e.key === "Escape" && eventRequestSlot) {
					e.preventDefault();
					closeEventRequest(true);
				}
			});
		window.removeEventListener("resize", dismissEventRequest);
		window.addEventListener("resize", dismissEventRequest);
	}

	function dismissEventRequest() { closeEventRequest(); }

	function closeEventRequest(restoreFocus) {
		var cell = eventRequestSlot && eventRequestSlot.cell;
		$("#eventRequestPopup").prop("hidden", true);
		$(".request-selected").removeClass("request-selected");
		eventRequestSlot = null;
		if (restoreFocus && cell && cell.isConnected) {
			cell.setAttribute("tabindex", "-1");
			cell.focus({preventScroll:true});
		}
	}

	function formatSlotHour(hour) {
		return (hour % 12 || 12) + (hour < 12 ? " AM" : " PM");
	}

	function churchSlotDateTime(date, hour) {
		// Visible hours are after Pacific daylight-saving transitions on the selected date.
		var offset = new Intl.DateTimeFormat("en-US", {timeZone:"America/Los_Angeles", timeZoneName:"longOffset"})
			.formatToParts(new Date(date + "T20:00:00Z")).find(function(part){return part.type === "timeZoneName";}).value.replace("GMT", "");
		return date + "T" + String(hour).padStart(2, "0") + ":00:00" + offset;
	}

	function generateUnassignedEvents(eventsObj, scheduleObj, selectedDate)
	{
		var unassignedEvents = getUnassignedEvents(eventsObj, scheduleObj, selectedDate);

		jQuery('<div>',{
			id: "divUnassignedEvents",
			class: "church-events"
		}).appendTo("#divMain");

		jQuery('<h2>').text("All Church Events").appendTo("#divUnassignedEvents");

		if (!unassignedEvents.length){
			jQuery('<div>',{
				class: "empty-events"
			}).text("No events without a room scheduled for this day.").appendTo("#divUnassignedEvents");
			return;
		}

		var list = jQuery('<table>',{
			class: "events-table"
		}).appendTo("#divUnassignedEvents");

		$.each(unassignedEvents,function(i,eventInstance){
			var eventId = eventInstance.relationships.event.data.id;
			var tr = jQuery('<tr>',{
				style: "cursor:pointer"
			}).attr("onClick","window.open('https://calendar.planningcenteronline.com/events/"+eventId+"?event_instance_id="+eventInstance.id+"', '_blank').focus();");
			tr.appendTo(list);

			jQuery('<td>',{
				class: "fw-bold"
			}).text(formatEventTimeForDate(eventInstance, selectedDate)).appendTo(tr);

			var eventCell = jQuery('<td>').appendTo(tr);
			jQuery('<a>', {href:"https://calendar.planningcenteronline.com/events/"+eventId+"?event_instance_id="+eventInstance.id, target:"_blank", rel:"noopener"}).text(eventInstance.attributes.name).appendTo(eventCell);
		});
	}

	function getUnassignedEvents(eventsObj, scheduleObj, selectedDate)
	{
		if (!eventsObj || !eventsObj.data)
			return [];

		var bookedEventInstanceIds = {};
		var includedBookingInstanceIds = {};
		var dayBounds = getLocalDayBounds(selectedDate);

		if (scheduleObj && scheduleObj.data){
			$.each(scheduleObj.data,function(i,booking){
				if (booking.relationships && booking.relationships.event_instance && booking.relationships.event_instance.data)
					bookedEventInstanceIds[booking.relationships.event_instance.data.id] = true;
			});
		}

		if (eventsObj.included){
			$.each(eventsObj.included,function(i,includedObj){
				if (includedObj.type == "ResourceBooking" && includedObj.relationships && includedObj.relationships.event_instance && includedObj.relationships.event_instance.data)
					includedBookingInstanceIds[includedObj.relationships.event_instance.data.id] = true;
			});
		}

		return $.grep(eventsObj.data,function(eventInstance){
			var eventStart = new Date(eventInstance.attributes.starts_at);
			var eventEnd = new Date(eventInstance.attributes.ends_at);
			var relationshipBookings = eventInstance.relationships && eventInstance.relationships.resource_bookings && eventInstance.relationships.resource_bookings.data;
			var hasRelationshipBookings = $.isArray(relationshipBookings) && relationshipBookings.length > 0;
			return timeRangesOverlap(eventStart, eventEnd, dayBounds.start, dayBounds.end)
				&& !hasRelationshipBookings
				&& !bookedEventInstanceIds[eventInstance.id]
				&& !includedBookingInstanceIds[eventInstance.id];
		});
	}

	function formatEventTimeForDate(eventInstance, selectedDate)
	{
		if (eventInstance.attributes.all_day_event)
			return "All day";

		var dayBounds = getLocalDayBounds(selectedDate);
		var eventStart = new Date(eventInstance.attributes.starts_at);
		var eventEnd = new Date(eventInstance.attributes.ends_at);
		var displayStart = eventStart < dayBounds.start ? dayBounds.start : eventStart;
		var displayEnd = eventEnd > dayBounds.end ? dayBounds.end : eventEnd;
		var timeOptions = {hour:"numeric", minute:"2-digit", timeZone:"America/Los_Angeles"};

		return displayStart.toLocaleTimeString("en-US", timeOptions) + " - " + displayEnd.toLocaleTimeString("en-US", timeOptions);
	}

	function MarkTimeSlot(time,resourceId, eventId,eventInstanceId)
	{
		var tdId = '#'+ time + '-' + resourceId;
		//find previous cell and see if event id exists and is different, if different - change color
		if (time>7){
			var prevTdId = '#'+ (time-1) + '-' + resourceId;
			var prevEventId=$(prevTdId).attr("event-id");
			if (prevEventId && prevEventId != eventId){
				busyColor = ($(prevTdId).hasClass("booked-alternate")?'rgba(252, 225, 220, 0.9)':'rgba(252, 237, 220, 0.9)');
			}
		}
		$(tdId).css("background-color",busyColor);
		$(tdId).css("cursor","pointer");
		$(tdId).attr("event-id",eventId);
		$(tdId).addClass("booked").toggleClass("booked-alternate",busyColor === 'rgba(252, 237, 220, 0.9)').attr({tabindex:0, role:"link", "aria-label":"Booked room, " + (time<=12?time:time-12) + (time<12?" am":" pm")});
		$(tdId).on("focus",function(){ShowInfo(this);}).on("blur",function(){$('#divInfo').hide();}).on("keydown",function(e){if(e.key === "Enter"){e.preventDefault();this.click();}});
		$(tdId).attr("onMouseOver","ShowInfo(this)");
		$(tdId).attr("onMouseOut","$('#divInfo').hide();");
		$(tdId).attr("onClick","window.open('https://calendar.planningcenteronline.com/events/"+eventId+"?event_instance_id="+eventInstanceId+"', '_blank').focus();");
		eventIds.indexOf(eventId) === -1 ? eventIds.push(eventId) : console.log(eventId +" already exists in array");
	}
	function SetDate(dayIncrement)
	{
		var dateStr = $("#datepicker").val()
		var dateOnly = dateStr.substring(0, dateStr.indexOf(","));
		$("#datepicker").datepicker( "setDate" , addDays(dateOnly,dayIncrement));
		RefreshCalendar();
	}
	function GoToToday() {
		$("#datepicker").datepicker("setDate", new Date());
		RefreshCalendar();
	}
	function addDays(date, days) {
	  var result = new Date(date);
	  result.setTime(result.getTime() + 8*60*60*1000); //add 8 hours to compensate fot PST
	  result.setDate(result.getDate() + days);
	  return result;
	}
	function addDaysToDateString(date, days) {
		var result = parseDateString(date);
		result.setDate(result.getDate() + days);
		return formatDateString(result);
	}
	function parseDateString(date) {
		var parts = date.split("-");
		return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
	}
	function formatDateString(date) {
		var month = String(date.getMonth() + 1).padStart(2, "0");
		var day = String(date.getDate()).padStart(2, "0");
		return date.getFullYear() + "-" + month + "-" + day;
	}
	function getLocalDayBounds(date) {
		var start = parseDateString(date);
		var end = new Date(start);
		end.setDate(end.getDate() + 1);
		return {start:start, end:end};
	}
	function ShowInfo(parentElement) {
		var info = eventInfo[$(parentElement).attr("event-id")];
		if (!info) return;
		if ($('#divInfo').is(":hidden")){
			//Populate div
			var eId = $(parentElement).attr("event-id");
			$('#divEventName').text(info.eventName);
			$('#divContactName').text([info.ownerName, info.phone].filter(Boolean).join(' - '));
			//position and display div
	        	var position = $(parentElement).offset();
			$('#divInfo').css({top:0, left:0}).show();
			var tooltip = $('#divInfo')[0].getBoundingClientRect();
			var _top = Math.max(8, position.top - window.scrollY - tooltip.height - 10);
			var _left = Math.max(8, Math.min(position.left - window.scrollX, window.innerWidth - tooltip.width - 8));
			$('#divInfo').css({ top: _top, left: _left });
		}
        }

<body>

<header class="site-header">
	<div class="header-inner">
		<div class="church-brand">
			<img src="https://www.brytechurch.org/wp-content/uploads/2018/11/cropped-LOGO-cropped.png" alt="" class="church-logo" onerror="this.hidden=true">
			<span>Bryte Church</span>
		</div>
		<a href="https://calendar.planningcenteronline.com/" target="_blank" rel="noopener" id="externalLink" class="planning-link">Planning Center <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>
	</div>
</header>
<main class="calendar-page">
	<div class="page-heading">
		<div><p class="eyebrow">CHURCH CALENDAR</p><h1>Room Availability</h1></div>
		<div class="legend"><span><i class="legend-free" aria-hidden="true"></i>Available</span><span><i class="legend-booked" aria-hidden="true"></i>Booked</span></div>
	</div>
	<section class="schedule-section" aria-label="Daily schedule">
		<div class="schedule-toolbar">
			<h2 id="selectedDay" aria-live="polite">Daily Schedule</h2>
			<div class="date-controls">
				<button type="button" class="today-button" onclick="GoToToday()">Today</button>
				<div class="date-navigation">
					<button type="button" onclick="SetDate(-1)" aria-label="Previous day" title="Previous day"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
					<label class="date-field"><i class="fa-regular fa-calendar" aria-hidden="true"></i><input type="text" id="datepicker" aria-label="Choose date" readonly></label>
					<button type="button" onclick="SetDate(1)" aria-label="Next day" title="Next day"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
				</div>
			</div>
		</div>
		<div id="divMain"></div>
	</section>
	<footer class="page-footer"><span>Bryte Church</span><span>Pacific Time</span></footer>
</main>
<div id="divInfo" role="tooltip"><div id="divEventName"></div><div id="divContactName"></div></div>
<div id="eventRequestPopup" class="event-request-popup" role="dialog" aria-labelledby="requestHeading" aria-describedby="requestRoom requestTime requestRoomNotice" hidden>
	<form id="eventRequestForm">
		<div class="request-heading"><h2 id="requestHeading">New event</h2><button type="button" class="request-close" onclick="closeEventRequest(true)" aria-label="Close new event" title="Close"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
		<p id="requestRoom" class="request-room"></p>
		<p id="requestTime" class="request-time"></p>
		<label for="requestEventName">Event name</label>
		<input type="text" id="requestEventName" name="eventName" maxlength="200" required autocomplete="off">
		<p id="requestRoomNotice" class="request-notice">Select the room on the Planning Center form.</p>
		<div class="request-actions"><button type="submit" class="request-continue">Continue <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></button></div>
	</form>
</div>
</body>
</html>
